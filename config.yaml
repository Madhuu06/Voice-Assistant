# ═══════════════════════════════════════════════════════════════
#  M.A.Y.A — Modular Adaptive Your Assistant
#  Configuration File
# ═══════════════════════════════════════════════════════════════

assistant:
  name: "Maya"
  personality: "friday"  # friday | casual | custom

# ── Activation ────────────────────────────────────────────────
activation:
  mode: "push_to_talk"       # push_to_talk | wake_word
  push_to_talk_key: "f12"    # Key to hold for recording
  wake_words: ["maya", "hey maya", "hello maya"]  # Fallback if mode=wake_word

# ── LLM (Ollama) ─────────────────────────────────────────────
llm:
  model: "qwen:7b"
  base_url: "http://localhost:11434/v1"
  max_tokens: 512
  temperature: 0.7
  system_prompt: |
    You are Maya, a voice assistant inspired by Tony Stark's F.R.I.D.A.Y.
    You are professional, concise, and slightly witty. Keep responses short
    and spoken-friendly — no markdown, no bullet points, no emojis.
    You control the user's Windows PC. You can open apps, search files,
    control volume, take screenshots, check system info, and see the screen.
    If the user asks something you can't do, say so briefly.
    Never be verbose. Two sentences max unless explaining something complex.

# ── STT (Whisper) ─────────────────────────────────────────────
stt:
  wake_model: "tiny"
  command_model: "base"
  sample_rate: 16000
  language: "en"

# ── TTS ───────────────────────────────────────────────────────
tts:
  engine: "edge_tts"          # edge_tts | elevenlabs | pyttsx3
  edge_tts:
    voice: "en-US-AnaNeural"  # Microsoft neural voice (FRIDAY-like)
    # Other options: en-US-JennyNeural, en-GB-SoniaNeural, en-US-AriaNeural
  pyttsx3:
    rate: 170
    volume: 1.0
    preferred_voices: ["Zira", "Hazel", "David"]

# ── Vision (Screen Awareness) ────────────────────────────────
vision:
  enabled: true
  model: "moondream"

# ── Memory ────────────────────────────────────────────────────
memory:
  db_path: "maya_memory.db"
  max_history: 20            # Conversation turns to keep in context
  log_commands: true

# ── Commands ──────────────────────────────────────────────────
commands:
  timeout: 30
  phrase_limit: 7
